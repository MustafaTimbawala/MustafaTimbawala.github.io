<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1016" />
    <meta
      name="description"
      content="Mustafa Timbawala — Software Engineer specializing in backend, full-stack, and mobile development. 4th-year Computer Science student at the University of Toronto, building with Python, FastAPI, React, and React Native."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://mustafatimbawala.ca/" />

    <link rel="apple-touch-icon" href="./icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Mustafa Timbawala — Software Engineer</title>

    <!-- Open Graph (LinkedIn, iMessage, Discord, Facebook link previews) -->
    <meta property="og:title" content="Mustafa Timbawala — Software Engineer" />
    <meta property="og:description" content="Backend, full-stack & mobile software engineer. Explore my projects, skills, and experience." />
    <meta property="og:image" content="https://mustafatimbawala.ca/Mustafa_PFP.png" />
    <meta property="og:url" content="https://mustafatimbawala.ca/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mustafa Timbawala" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mustafa Timbawala — Software Engineer" />
    <meta name="twitter:description" content="Backend, full-stack & mobile software engineer. Explore my projects, skills, and experience." />
    <meta name="twitter:image" content="https://mustafatimbawala.ca/Mustafa_PFP.png" />

    <!-- Structured data: helps Google show a rich Person result -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mustafa Timbawala",
        "url": "https://mustafatimbawala.ca/",
        "jobTitle": "Software Engineer",
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "University of Toronto"
        },
        "sameAs": [
          "https://github.com/MustafaTimbawala/MustafaTimbawala",
          "https://www.linkedin.com/in/mustafa-timbawala/"
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
